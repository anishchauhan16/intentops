[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "intentops"
version = "0.1.0"
description = "A compact, deployment-oriented banking intent router"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=16,<24",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
data = ["datasets>=4,<5"]
semantic = ["sentence-transformers>=3,<6"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "httpx>=0.27,<1", "ruff>=0.9,<1", "mypy>=1.14,<2", "pandas-stubs>=2.2,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
intentops = ["templates/*.html", "static/*.css"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["demo-release"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=intentops --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["intentops"]

[tool.mypy]
python_version = "3.11"
files = ["src", "scripts"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib", "datasets", "sentence_transformers"]
ignore_missing_imports = true
